name: Bug report
description: Something in the kit does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Include the exact error string."}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: "`lak doctor` output"
      render: text
    validations: {required: true}
  - type: input
    id: versions
    attributes: {label: Versions, placeholder: "llama.cpp build, llama-swap, opencode / Claude Code, driver"}
  - type: textarea
    id: logs
    attributes: {label: Relevant llama-swap / llama-server log lines, render: text}
